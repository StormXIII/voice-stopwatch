<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f3ef" />
    <title>计时器</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="timer-app">
      <div class="timer-shell" aria-live="polite">
        <p class="eyebrow">STOPWATCH</p>
        <p class="timer-display" id="timerDisplay">00:00.00</p>
        <p class="timer-status" id="timerStatus">准备开始</p>

        <div class="controls">
          <button class="reset-button" id="resetButton" type="button">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 12a8.25 8.25 0 1 0 2.42-5.83L3.75 8.59M3.75 4.75v3.84h3.84" />
            </svg>
            <span>清零</span>
          </button>
          <button class="voice-toggle" id="voiceToggle" type="button" aria-pressed="false" title="语音控制">
            <span class="voice-dot" aria-hidden="true"></span>
            <span class="voice-toggle-text">语音</span>
          </button>
        </div>
      </div>
    </main>

    <button class="help-button" id="helpButton" type="button" aria-haspopup="dialog" aria-controls="helpOverlay" aria-expanded="false" title="语音指令帮助">?</button>

    <div class="modal-overlay" id="helpOverlay" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
        <header class="modal-header">
          <h2 class="modal-title" id="helpTitle">语音指令</h2>
          <button class="modal-close" id="helpClose" type="button" aria-label="关闭帮助">✕</button>
        </header>
        <p class="modal-hint">开启语音监听后，说出以下任意词语即可触发对应操作。</p>
        <ul class="command-list" id="commandList"></ul>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
